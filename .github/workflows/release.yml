# When a tag vX.Y.Z is pushed: runs the tests, then creates the GitHub release
# with the "## [X.Y.Z]" section of CHANGELOG.md as its notes.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  github-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="## [$version]" 'index($0, v) == 1 {on = 1; next} /^## / && on {exit} on' CHANGELOG.md \
            | sed '/^---$/d' > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section ## [$version]"; exit 1; }
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
